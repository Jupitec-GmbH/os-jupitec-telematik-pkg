{"name":"os-jupitec-telematik","origin":"opnsense/os-jupitec-telematik","version":"1.1.10","comment":"Jupitec Telematik Infrastructure Integration","maintainer":"info@jupitec.de","www":"https://jupitec.de","abi":"FreeBSD:14:amd64","arch":"freebsd:14:x86:64","prefix":"/usr/local","flatsize":283768,"desc":"Telematik Infrastructure (TI) integration plugin for OPNsense.\n\nProvides a TI-Proxy service that connects card terminals in medical\npractices to the Telematik Infrastruktur via a WireGuard tunnel to\na TIaaS provider (e.g. RISE).\n\nFeatures:\n- WireGuard tunnel configuration for TI connectivity\n- TI-Proxy service (UDP/TCP relay to Konnektor)\n- Card terminal management (multi-terminal support)\n- Setup wizard for importing provider configuration\n- Automatic firewall rule generation\n- TI DNS override support\n- Service diagnostics and health monitoring\n\nSponsored by Jupitec.\n\nWWW: https://jupitec.de","categories":["sysutils"],"sum":"8318c9840a97b540857d7ea63a82fe900345385279b49deea476b90cc69673a2","path":"os-jupitec-telematik-1.1.10.pkg","repopath":"os-jupitec-telematik-1.1.10.pkg","pkgsize":58680}
{"name":"os-lumia","origin":"opnsense/os-lumia","version":"0.1.3","comment":"Lumia RMM agent: outbound health reporting, ring-scheduled patching and config management","maintainer":"ops@jupitec.de","www":"https://www.jupitec.de/lumia","abi":"FreeBSD:14:amd64","arch":"freebsd:14:x86:64","prefix":"/usr/local","flatsize":123099,"licenselogic":"single","licenses":["BSD2CLAUSE"],"desc":"Lumia RMM agent for OPNsense.\n\nConnects OUTBOUND to a Lumia server and enrols this firewall as a managed\ndevice with its own identity, alerts and update ring. No inbound access to the\nfirewall's web interface is needed and no OPNsense API key is created: the\nagent talks to the local configd socket and reads /conf/config.xml directly.\n\nWhat it reports: firmware and plugin update state, service, gateway,\ninterface, IDS, HA and VPN health, and — when asked — configuration backups.\n\nWhat it can do, each behind a server-side feature flag and a local\nmanagement-mode setting that defaults to monitor-only:\n  - ring-scheduled firmware and plugin upgrades inside maintenance windows,\n    with a pre-upgrade config backup and post-reboot health verification;\n  - central configuration templates applied with a confirm-or-revert\n    dead-man's switch, so a bad rule can never leave the firewall unreachable.\n\nWorks identically on OPNsense Community Edition and Business Edition.\n\nWWW: https://www.jupitec.de/lumia","categories":["net-mgmt"],"annotations":{"product_abi":"26.1","product_arch":"amd64","product_conflicts":"os-lumia-devel","product_email":"ops@jupitec.de","product_hash":"033c167ee","product_id":"os-lumia","product_name":"lumia","product_tier":"3","product_version":"0.1.3","product_website":"https://www.jupitec.de/lumia"},"sum":"3d58e16df05bf6ab9d26a25743a8b3896e3818e5a344a45d4305228de000ab96","path":"os-lumia-0.1.3.pkg","repopath":"os-lumia-0.1.3.pkg","pkgsize":35959}
